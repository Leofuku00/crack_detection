[project]
name = "crack-detection"
version = "0.1.0"
description = "Native-resolution crack segmentation for painted walls"
requires-python = ">=3.12"
dependencies = [
    "ftfy>=6.3.1",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "regex>=2026.11.19",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "termcolor>=3.3.0",
    "torch>=2.7.1",
    "torchvision>=0.22",
    "transformers==4.57.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
